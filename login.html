<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login TaskFlow</title>
</head>
<body>
    <main>
        <div id="img-main">
            <img src="image.jpg" alt="">
        </div>
        <div id="login">
            <div id="title-form">
                <p>Login</p>
            </div>
            <div id="form-login">
                <div id="user-id" class="input-form">
                    <input type="text" name="user-id" id="input-id" placeholder="Login">
                </div>
                <div id="user-password" class="input-form">
                    <input type="text" name="user-password" id="input-password" placeholder="Senha">
                </div>
                <div id="button-form">
                    <button type="button">Login</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
