            <div id="right-selection" class="forms">
                <form id="task-form">
                    <div id="title-label" class="box-label">
                        <label for="task-title">Título</label>
                        <input type="text" id="task-title" placeholder="'Arrumar a cozinha'">
                    </div>

                    <div id="description-label" class="box-label">
                        <label for="task-description">Descrição</label>
                        <input type="text" id="task-description" placeholder="'Limpar a pia, chão e balcão'">
                    </div>

                    <div id="category-label" class="box-label">
                        <label for="category">Escolha uma opção:</label>
                        <select id="category" name="category">
                            <option value="" disabled selected>-- Por favor, selecione --</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Casa">Casa</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Financas">Finanças</option>
                            <option value="Saude">Saúde</option>
                            <option value="Compras">Compras</option>
                            <option value="Projeto">Projeto</option>
                            <option value="Lazer">Lazer</option>
                        </select>
                    </div>

                    <div id="priority-label" class="box-label">
                        <label>Prioridade:</label>
                        <div>
                            <input type="radio" id="p-not-important" name="task-priority" value="Não Importante">
                            <label for="p-not-important">Não Importante</label>

                            <input type="radio" id="p-medium" name="task-priority" value="Média">
                            <label for="p-medium">Média</label>

                            <input type="radio" id="p-important" name="task-priority" value="Importante">
                            <label for="p-important">Importante</label>

                            <input type="radio" id="p-urgent" name="task-priority" value="Urgente">
                            <label for="p-urgent">Urgente</label>
                        </div>
                    </div>

                    <button type="submit" id="add-task-btn">Adicionar Tarefa</button>
                </form>
            </div>

            <div id="left-selection" class="forms">
                <img src="" alt="Imagem Ilustrativa">
